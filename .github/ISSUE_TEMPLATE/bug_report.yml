name: Bug report
description: Report a reproducible problem in the IMDE VS Code extension.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Please remove any SDK paths, logs,
        or files that contain credentials or confidential source code.
  - type: input
    id: version
    attributes:
      label: IMDE version
      description: The extension version shown in VS Code.
      placeholder: "0.3.6"
    validations:
      required: true
  - type: input
    id: vscode
    attributes:
      label: VS Code version and platform
      placeholder: "1.85.0 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence of actions.
      placeholder: |
        1. Open ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and relevant logs
      description: Redact sensitive information before submitting.
    validations:
      required: true
